name: Build image and automatically push to Docker Hub 
on: 
    push:
        branches:
            - sept20
jobs:
    deployment: 
        runs-on: ubuntu-latest
        steps: 
            - name: "Checkouts of the repository"
              uses: actions/checkout@v4
        
            - name: "Build the image"
              run: |
                sudo docker build -t theoafactor/testbooksfinder:second .

            - name: "Log in to Docker Hub"
              run: |
                sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: "Push to Docker Hub"
              run: |
                sudo docker push theoafactor/testbooksfinder:second

            - name: "Test Okay"
              run: |
                echo "Everything works fine"
                